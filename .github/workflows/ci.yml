name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: wsngame sweep --params dB2 --nodes 200 --networks 2 --rounds 20 --out /tmp/r && wsngame plot /tmp/r/dB2.csv --out /tmp/r/p.png
